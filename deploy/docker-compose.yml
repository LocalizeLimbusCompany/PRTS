# PRTS 全栈编排：backend + frontend + postgres(pgvector) + redis。
# 用法（在仓库根目录）：
#   cp .env.example .env
#   docker compose -f deploy/docker-compose.yml up -d --build
# 注：postgres 直接拉取 GHCR 预构建镜像（含 zhparser），不在本地编译；--build 仅重建 backend/frontend。
#     首次拉取需 prts-postgres 包为 public，或已 `docker login ghcr.io`。
name: prts

services:
  postgres:
    # 直接拉取 CI 预构建镜像（含 pgvector + zhparser），避免部署时本地编译 zhparser（慢、需 GitHub 可达）。
    # 该 GHCR 包需为 public，或先 `docker login ghcr.io`。
    # 如需从源码构建：docker build -f deploy/postgres.Dockerfile -t ghcr.io/localizelimbuscompany/prts-postgres:latest ..
    image: ghcr.io/localizelimbuscompany/prts-postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-prts_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-dev-migrator-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-prts}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-prts_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-dev-runtime-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_MIGRATION_USER:-prts_migrator} -d ${POSTGRES_DB:-prts}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: ghcr.io/localizelimbuscompany/prts-backend:latest
    env_file:
      - path: ../.env
        required: false
    environment:
      PRTS__DATABASE__MIGRATION_URL: postgres://${POSTGRES_MIGRATION_USER:-prts_migrator}:${POSTGRES_MIGRATION_PASSWORD:-dev-migrator-change-me}@postgres:5432/${POSTGRES_DB:-prts}
      PRTS__DATABASE__RUNTIME_ROLE: ${POSTGRES_RUNTIME_USER:-prts_runtime}
    command: ['prts-api', 'migrate']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: ghcr.io/localizelimbuscompany/prts-backend:latest
    # 从根目录 .env 注入认证等 PRTS__* 配置；migration URL 被显式清空，runtime
    # 进程不会持有 owner 凭据。
    env_file:
      - path: ../.env
        required: false
    environment:
      PRTS__SERVER__HOST: 0.0.0.0
      PRTS__SERVER__PORT: '3000'
      PRTS__DATABASE__URL: postgres://${POSTGRES_RUNTIME_USER:-prts_runtime}:${POSTGRES_RUNTIME_PASSWORD:-dev-runtime-change-me}@postgres:5432/${POSTGRES_DB:-prts}
      PRTS__DATABASE__MIGRATION_URL: ''
      PRTS__DATABASE__RUNTIME_ROLE: ${POSTGRES_RUNTIME_USER:-prts_runtime}
      PRTS__REDIS__URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    ports:
      # 宿主机端口可经 .env 的 BACKEND_PORT 调整（默认 3000 被占用时改这里）
      - '${BACKEND_PORT:-3000}:3000' # 暴露以便访问 Swagger UI（/swagger-ui）；生产可仅内网
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    image: ghcr.io/localizelimbuscompany/prts-frontend:latest
    ports:
      # 宿主机端口可经 .env 的 FRONTEND_PORT 调整（默认 8080 被占用时改这里）
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

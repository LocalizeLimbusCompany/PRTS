# PRTS 前端 nginx 配置：托管 SPA 静态资源，并反代 /api、/ws 到后端。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    # SPA 路由回退：未命中文件一律交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代：剥离 /api 前缀转发到后端根路径（与前端 axios baseURL=/api 对应）
    location /api/ {
        client_max_body_size 100m;
        proxy_request_buffering off;
        # AI explanation SSE can run up to 600 seconds and must reach the browser incrementally.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 650s;
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public OpenAPI contract and Swagger UI. Keep the backend paths unchanged so generated
    # asset URLs and the documented JSON URL resolve directly from the main site.
    location /swagger-ui {
        proxy_pass http://backend:3000/swagger-ui;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs/ {
        proxy_pass http://backend:3000/api-docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket（P3 实时编辑器启用）
    location /ws/ {
        proxy_pass http://backend:3000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

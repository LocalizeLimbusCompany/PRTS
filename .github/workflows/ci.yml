name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend (fmt / clippy / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p prts-api --all-targets --features zoot-oauth -- -D warnings
      - run: cargo test --workspace
      - name: Verify project workspace contracts
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: ./scripts/verify-project-workspace.ps1
      # 集成测试依赖 zhparser（见 migration 0004），stock pgvector 镜像没有该扩展，
      # 故在此构建并运行自定义 Postgres 镜像（deploy/postgres.Dockerfile）。
      # GitHub Actions 的 services: 无法构建本地 Dockerfile，因此改用显式 docker 步骤。
      - name: Build Postgres (zhparser) image
        working-directory: ${{ github.workspace }}
        run: docker build -f deploy/postgres.Dockerfile -t prts-postgres:ci .
      - name: Start Postgres + Redis
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=prts_migrator -e POSTGRES_PASSWORD=migrator-ci \
            -e POSTGRES_RUNTIME_USER=prts_runtime -e POSTGRES_RUNTIME_PASSWORD=runtime-ci \
            -e POSTGRES_DB=prts_test \
            prts-postgres:ci
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U prts_migrator && break; sleep 2; done
          docker exec pg pg_isready -U prts_migrator || { echo "Postgres not ready after 60s"; docker logs pg; exit 1; }
      - name: Integration tests (Postgres)
        run: cargo test -p prts-api --features db-tests
        env:
          MIGRATION_DATABASE_URL: postgres://prts_migrator:migrator-ci@localhost:5432/prts_test
          DATABASE_URL: postgres://prts_runtime:runtime-ci@localhost:5432/prts_test
          PRTS_TEST_RUNTIME_ROLE: prts_runtime
          PRTS__REDIS__URL: redis://localhost:6379

  frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3 # 与 frontend/package.json 的 packageManager 一致
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  images:
    name: Build & push images (GHCR)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: deploy/backend.Dockerfile
            tag: latest
            sha_suffix: ''
            build_args: ''
          - name: backend
            dockerfile: deploy/backend.Dockerfile
            tag: oauth-latest
            sha_suffix: -oauth
            build_args: PRTS_BACKEND_FEATURES=zoot-oauth
          - name: frontend
            dockerfile: deploy/frontend.Dockerfile
            tag: latest
            sha_suffix: ''
            build_args: ''
          - name: postgres
            dockerfile: deploy/postgres.Dockerfile
            tag: latest
            sha_suffix: ''
            build_args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/prts-${{ matrix.name }}
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=sha,suffix=${{ matrix.sha_suffix }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
